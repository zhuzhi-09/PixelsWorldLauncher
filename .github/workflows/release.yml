name: Release

# 推送 v* 标签时在三个平台打包并发布到 GitHub Releases；
# 手动运行时只打包并上传为构建产物，不发布
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
                 --title "PixelsWorld Launcher $GITHUB_REF_NAME" --generate-notes \
                 $([[ "$GITHUB_REF_NAME" == *-* ]] && echo --prerelease)

  build:
    needs: create-release
    # 手动运行时 create-release 被跳过，仍然继续打包
    if: ${{ !cancelled() && !failure() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --win --x64
          - os: macos-latest
            args: --mac
          - os: ubuntu-latest
            args: --linux --x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Use tag as version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Package
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 暂不签名
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then PUBLISH=always; else PUBLISH=never; fi
          npx electron-builder ${{ matrix.args }} --publish "$PUBLISH"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pixelsworld-${{ runner.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: ignore
